<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ice blue glow circle -->
  <circle cx="600" cy="200" r="350" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="#0ea5e9"/>

  <!-- Ice emoji -->
  <text x="600" y="220" font-size="120" text-anchor="middle" dominant-baseline="middle">🧊</text>

  <!-- Main title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="64" font-weight="900"
        fill="white" text-anchor="middle" direction="rtl">חוויות שוויץ המדע</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="36" font-weight="400"
        fill="#7dd3fc" text-anchor="middle" direction="rtl">אמבטיות קרח מקצועיות · רחובות</text>

  <!-- CTA text -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="28" font-weight="700"
        fill="#0ea5e9" text-anchor="middle" direction="rtl">נכנסים לקרח – יוצאים חדים וחסינים</text>

  <!-- URL -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="22" font-weight="400"
        fill="#475569" text-anchor="middle">icing-blond.vercel.app</text>

  <!-- Bottom accent -->
  <rect x="0" y="624" width="1200" height="6" fill="#0ea5e9"/>
</svg>
